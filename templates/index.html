{% extends 'base.html' %}
{% load static %}

{% block title %}index{% endblock %}

{% block content %}
    <p>Last posts:</p>
    {% for post in last_posts %}
        <a href="https://www.google.com"class=center>{{post}}</a><br>
    {% endfor %}
    <p class="error center">{{error}}</p>
    <a href="https://www.google.com" class="button">All posts</a>
{% endblock %}
